<style>
:root{
  --bg:#f7f3ec; --text:#2c2416; --text2:#5a4e3a; --text-muted:#6B5B4B;
  --accent:#8b5e3c; --accentL:#c4956a; --accent-red:#8B2500;
  --gold:#b8860b; --goldL:#d4a84b; --gold-light:#C9A84C;
  --border:#d4c4a8; --border-light:#EDE8E0; --card:#fffdf7;
  --verseBg:#f0e8d8; --verseBd:#c4956a;
  --sbW:76px; --sbBg:#1e1a14; --sbText:#d4c4a8;
  --headGrad:linear-gradient(135deg,#2a2218 0%,#3d3225 50%,#2a2218 100%);
  --r:8px; --primary:#2C1810; --primary-light:#5B3A29; --shadow:rgba(91,58,41,0.08);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{scrollbar-width:none;-ms-overflow-style:none;}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0;}
body{font-family:"Noto Serif TC","Source Han Serif TC","Songti TC",Georgia,serif;
  background:var(--bg);color:var(--text);font-size:17px;line-height:1.8;
  -webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;
  -webkit-touch-callout:none;}
img{-webkit-user-drag:none;-khtml-user-drag:none;pointer-events:none;}

/* ========== 左側欄 ========== */
#sb{position:fixed;left:0;top:0;width:var(--sbW);height:100vh;
  background:var(--sbBg);color:var(--sbText);z-index:100;
  display:flex;flex-direction:column;align-items:center;
  padding:0 0 16px;overflow-y:auto;scrollbar-width:none;}
#sb::-webkit-scrollbar{display:none;}
.sb-brand{position:sticky;top:0;width:100%;
  font-family:"Noto Sans TC",sans-serif;font-size:11px;letter-spacing:2px;
  color:var(--gold);text-align:center;line-height:1.5;
  background:linear-gradient(to bottom,var(--sbBg) 78%,rgba(30,26,20,0));
  padding:14px 4px 12px;margin-bottom:6px;z-index:5;
  text-decoration:none;cursor:pointer;
  transition:color .25s,background .25s;display:block;
  border-bottom:1px solid rgba(184,134,11,.25);}
.sb-brand:hover{color:var(--goldL);}
.sb-brand .sb-brand-line1{display:block;font-size:11px;letter-spacing:1.5px;opacity:.78;}
.sb-brand .sb-brand-line2{display:block;font-size:13px;font-weight:700;
  letter-spacing:2.2px;color:var(--goldL);margin-top:2px;}
.sb-brand .sb-brand-arrow{display:block;font-size:10px;opacity:.55;margin-top:2px;}
.sb-nav{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;padding:0 6px;}
.sb-item{display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:3px 4px;text-decoration:none;color:var(--sbText);
  border-radius:10px;transition:all .3s;cursor:pointer;width:100%;}
.sb-item:hover{background:rgba(184,134,11,.15);color:var(--goldL);}
.sb-item.active{background:rgba(184,134,11,.25);color:var(--goldL);
  box-shadow:0 0 14px rgba(184,134,11,.32);}
.sb-circle{display:flex;align-items:center;justify-content:center;
  width:34px;height:34px;border-radius:50%;
  background:rgba(184,134,11,.18);color:var(--goldL);
  font-family:"Noto Sans TC",sans-serif;font-weight:700;font-size:15px;
  border:1px solid rgba(184,134,11,.35);}
.sb-item.active .sb-circle{background:var(--gold);color:#fff;
  box-shadow:0 0 12px rgba(212,168,75,.55);}
.sb-label{font-size:11.5px;letter-spacing:1px;text-align:center;line-height:1.3;}

/* 漢堡 */
#sbToggle{display:none;position:fixed;top:18px;left:18px;z-index:110;
  width:44px;height:44px;border-radius:50%;border:0;
  background:var(--sbBg);color:var(--gold);font-size:22px;cursor:pointer;
  box-shadow:0 4px 14px rgba(0,0,0,.2);}

/* ========== 底部進度膠囊 ========== */
.read-progress{
  position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
  z-index:120;background:rgba(30,26,20,.92);color:var(--gold);
  padding:9px 24px;border-radius:30px;
  border:1px solid rgba(184,134,11,.5);
  box-shadow:0 4px 18px rgba(0,0,0,.25);
  font-family:"Noto Sans TC",sans-serif;
  font-size:14px;letter-spacing:2px;
  display:flex;align-items:center;gap:12px;
  pointer-events:none;user-select:none;
  backdrop-filter:blur(6px);
  transition:opacity .45s ease,transform .45s ease;
}
.read-progress.hide-near-end{opacity:0;transform:translateX(-50%) translateY(28px);}
.read-progress .rp-bar{width:148px;height:4px;background:rgba(212,196,168,.18);
  border-radius:2px;overflow:hidden;position:relative;}
.read-progress .rp-fill{position:absolute;top:0;left:0;bottom:0;
  background:linear-gradient(90deg,var(--gold),var(--goldL));
  width:0%;transition:width .3s;}
.read-progress .rp-pct{font-weight:600;min-width:38px;text-align:right;font-size:13px;}
.read-progress .rp-label{font-size:13px;opacity:.85;letter-spacing:4px;color:var(--goldL);}

/* ========== 主內容 ========== */
.main{margin-left:var(--sbW);min-height:100vh;}
.site-hero{position:relative;background:var(--headGrad);
  color:#fff;padding:90px 32px 80px;text-align:center;overflow:hidden;}
.site-hero::before{content:"般若";position:absolute;
  font-family:"Noto Serif TC",serif;font-size:380px;font-weight:900;
  color:rgba(212,168,75,.04);top:50%;left:50%;transform:translate(-50%,-50%);
  pointer-events:none;line-height:1;letter-spacing:.05em;}
.hero-content{position:relative;z-index:1;max-width:920px;margin:0 auto;}
.hero-title{font-size:56px;font-weight:900;letter-spacing:6px;color:var(--goldL);
  margin-bottom:14px;text-shadow:0 2px 14px rgba(184,134,11,.3);}
.hero-subtitle{font-size:20px;letter-spacing:4px;color:#e8d9b8;margin-bottom:10px;}
.hero-sub{font-size:18px;letter-spacing:2px;color:#c9b994;font-style:italic;}
.hero-meta{font-size:15px;letter-spacing:1px;color:#b8a98a;margin-top:24px;
  border-top:1px solid rgba(184,134,11,.3);padding-top:18px;display:inline-block;}

/* 編者前言 */
.preface{max-width:880px;margin:48px auto;padding:0 32px;}
.preface-title{font-family:"Noto Serif TC",serif;text-align:center;
  font-size:30px;color:var(--accent);letter-spacing:6px;margin-bottom:28px;
  padding-bottom:14px;border-bottom:2px solid var(--gold);}
.preface p{font-size:19px;line-height:2.1;color:var(--text);
  text-align:justify;text-indent:2em;margin-bottom:18px;}

/* 總目錄 */
.toc-section{max-width:1100px;margin:60px auto;padding:0 32px;}
.toc-title{text-align:center;font-size:34px;color:var(--accent);
  letter-spacing:8px;margin-bottom:12px;}
.toc-desc{text-align:center;color:var(--text2);letter-spacing:2px;
  font-size:17px;margin-bottom:32px;}
.toc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:20px;}
.toc-card{background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:24px;display:flex;gap:18px;align-items:flex-start;
  transition:transform .25s,box-shadow .25s,border-color .25s;
  text-decoration:none;color:inherit;cursor:pointer;}
.toc-card:hover{transform:translateY(-3px);
  box-shadow:0 8px 24px rgba(184,134,11,.15);border-color:var(--gold);}
.toc-num{flex-shrink:0;width:44px;height:44px;border-radius:50%;
  background:var(--gold);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-family:"Noto Serif TC",serif;font-weight:700;font-size:17px;
  box-shadow:0 2px 8px rgba(184,134,11,.3);}
.toc-name{font-size:19.5px;line-height:1.7;color:var(--text);
  font-weight:600;flex:1;}
.toc-sub{display:block;font-size:14.5px;color:var(--text2);
  margin-top:6px;font-weight:400;letter-spacing:.5px;}

/* 章節（每品） */
.chapter{margin:50px 0 0;}
.ch-head{background:var(--headGrad);color:#fff;
  padding:42px 32px;text-align:center;}
.ch-num{font-family:"Noto Sans TC",sans-serif;font-size:18px;
  letter-spacing:6px;color:var(--goldL);margin-bottom:10px;opacity:.85;}
.ch-name{font-size:34px;color:#fff;letter-spacing:4px;font-weight:700;margin-bottom:8px;}
.ch-sub,.ch-desc,.ch-subtitle{font-size:17px;color:#e8d9b8;
  letter-spacing:2px;font-style:italic;}
.ch-head::after{content:"";display:block;width:80px;height:2px;
  background:var(--gold);margin:20px auto 0;}
.ch-body{padding:36px 18px 12px;max-width:1100px;margin:0 auto;}

/* 橋接 */
.bridge{background:linear-gradient(135deg,#fffdf5,#f5ecd8);
  border:1px solid var(--border);border-left:5px solid var(--gold);
  border-radius:10px;padding:18px 24px;margin:0 0 26px;
  box-shadow:0 2px 10px rgba(91,58,41,.06);}
.bridge-outro{border-left-color:var(--accentL);
  background:linear-gradient(135deg,#fdf8e8,#f2e6c8);
  margin-top:30px;margin-bottom:14px;}
.bridge-label{display:inline-block;font-family:"Noto Sans TC",sans-serif;
  font-size:12.5px;background:var(--gold);color:#fff;
  padding:3px 12px;border-radius:12px;
  letter-spacing:2.2px;margin-bottom:10px;}
.bridge-outro .bridge-label{background:var(--accent);}
.bridge p{margin:0;color:var(--text2);line-height:2.1;font-size:18.5px;}

/* iframe */
.ch-frame{display:block;width:100%;border:0;
  background:#fffdf7;border:1px solid var(--border);
  border-radius:12px;box-shadow:0 4px 20px rgba(91,58,41,.1);
  margin:0 0 8px;min-height:180px;}

/* 下一品連結 */
.next-link{display:inline-block;margin:18px 0 6px;
  font-family:"Noto Sans TC",sans-serif;font-size:17px;
  color:var(--accent);text-decoration:none;
  border-bottom:1px dashed var(--accent);padding-bottom:2px;
  transition:color .2s,border-color .2s;}
.next-link:hover{color:var(--gold);border-color:var(--gold);}

/* 回頂 */
#backTop{position:fixed;right:24px;bottom:70px;
  width:44px;height:44px;border-radius:50%;border:0;
  background:var(--accent);color:#fff;font-size:18px;
  cursor:pointer;display:none;
  box-shadow:0 4px 14px rgba(0,0,0,.2);z-index:90;}
#backTop.show{display:block;}

/* footer */
.site-footer{padding:32px 24px;text-align:center;
  background:var(--sbBg);color:var(--sbText);
  font-size:15px;letter-spacing:2px;margin-top:60px;}
.site-footer p{margin:6px 0;font-size:15px;}
.site-footer .footer-gatha{color:var(--goldL);font-size:16px;
  letter-spacing:3px;margin-bottom:14px;}

/* RWD */
@media(max-width:900px){
  #sb{transform:translateX(-100%);transition:transform .3s;}
  #sb.show{transform:translateX(0);}
  #sbToggle{display:block;}
  .main{margin-left:0;}
  .site-hero{padding:60px 24px 50px;}
  .hero-title{font-size:40px;}
  .ch-head{padding:28px 18px;}
  .ch-name{font-size:26px;}
  .toc-grid{grid-template-columns:1fr;}
}
@media(max-width:600px){
  body{font-size:15.5px;}
}

/* ============ 1.2x 字級放大（buddhist-text-html 新卷預設）============ */
body{font-size:20px!important;}
.hero-title,.site-hero h1{font-size:56px!important;}
.hero-subtitle,.site-hero .hero-subtitle{font-size:20px!important;}
.hero-sub,.site-hero .hero-sub,.hero-meta{font-size:18px!important;}
.preface p,.preface-text p{font-size:19px!important;line-height:2.1!important;}
.preface h2,.preface-title{font-size:30px!important;}
.toc-title{font-size:34px!important;}
.toc-desc{font-size:17px!important;}
.toc-name{font-size:19.5px!important;line-height:1.7!important;}
.toc-num{font-size:17px!important;}
.bridge p{font-size:18.5px!important;line-height:2.1!important;}
.bridge-label{font-size:12.5px!important;letter-spacing:2.2px!important;}
.ch-num{font-size:18px!important;}
.ch-name{font-size:34px!important;}
.ch-sub,.ch-desc,.ch-subtitle{font-size:17px!important;}
.next-link{font-size:17px!important;}
.read-progress{font-size:14px!important;padding:9px 24px!important;}
.read-progress .rp-bar{width:148px!important;height:4px!important;}
.read-progress .rp-pct{font-size:13px!important;}
.read-progress .rp-label{font-size:12px!important;}
.sb-circle{font-size:15px!important;}
.sb-label{font-size:11.5px!important;}
.site-footer,.site-footer p{font-size:15px!important;}

<script>
// 漢堡
(function(){
  var t=document.getElementById('sbToggle'),s=document.getElementById('sb');
  if(!t||!s) return;
  t.addEventListener('click',function(){s.classList.toggle('show');});
})();

// sb-brand → 回頂
(function(){
  var b=document.getElementById('sbBrand');
  if(!b) return;
  b.addEventListener('click',function(e){
    e.preventDefault();
    window.scrollTo({top:0,behavior:'smooth'});
  });
})();

// backTop
(function(){
  var b=document.getElementById('backTop');
  if(!b) return;
  window.addEventListener('scroll',function(){
    b.classList.toggle('show', window.scrollY>600);
  },{passive:true});
  b.addEventListener('click',function(){
    window.scrollTo({top:0,behavior:'smooth'});
  });
})();

// 側欄 active 高亮
(function(){
  var items = document.querySelectorAll('.sb-item');
  var chapters = document.querySelectorAll('.chapter');
  function update(){
    var current = -1;
    var threshold = window.innerHeight * 0.35;
    chapters.forEach(function(ch,i){
      if(ch.getBoundingClientRect().top < threshold) current = i;
    });
    items.forEach(function(it,i){it.classList.toggle('active', i===current);});
    var act = document.querySelector('.sb-item.active');
    if(act){
      var sb = document.getElementById('sb');
      var r = act.getBoundingClientRect();
      var sr = sb.getBoundingClientRect();
      if(r.top < sr.top + 60 || r.bottom > sr.bottom - 60){
        sb.scrollTo({top: sb.scrollTop + (r.top - sr.top) - sr.height/2 + r.height/2, behavior:'smooth'});
      }
    }
  }
  window.addEventListener('scroll', update, {passive:true});
  update();
})();

// 進度膠囊
var rpFill = document.getElementById('rpFill');
var rpPct  = document.getElementById('rpPct');
function updateProgress(){
  var sh = document.documentElement.scrollHeight - window.innerHeight;
  var pct = sh > 0 ? Math.min(100, Math.max(0, window.scrollY / sh * 100)) : 0;
  if(rpFill) rpFill.style.width = pct + '%';
  if(rpPct)  rpPct.textContent  = Math.round(pct) + '%';
}
window.addEventListener('scroll', updateProgress, {passive:true});
updateProgress();

// 進度膠囊：接近頁尾自動淡出
(function(){
  var cap = document.getElementById('readProgress');
  if(!cap) return;
  function setHide(on){ cap.classList.toggle('hide-near-end', !!on); }
  var targets = [];
  var f1 = document.querySelector('[data-wy-notice="v2"]');
  if(f1) targets.push(f1);
  var f2 = document.querySelector('.site-footer');
  if(f2) targets.push(f2);
  if(!targets.length) return;
  if('IntersectionObserver' in window){
    var io = new IntersectionObserver(function(entries){
      var any = entries.some(function(e){return e.isIntersecting;});
      setHide(any);
    }, {root:null, rootMargin:'0px 0px -20px 0px', threshold:0.01});
    targets.forEach(function(t){ io.observe(t); });
  } else {
    var check=function(){
      var dh=document.documentElement.scrollHeight;
      var sb=window.scrollY+window.innerHeight;
      setHide(dh - sb < 240);
    };
    window.addEventListener('scroll', check, {passive:true});
    check();
  }
})();

// iframe 自動高度
function resizeFrame(f){
  try{
    var d = f.contentDocument || f.contentWindow.document;
    if(!d || !d.body) return;
    d.body.style.minHeight = '0';
    d.body.style.height    = 'auto';
    if(d.documentElement){
      d.documentElement.style.minHeight = '0';
      d.documentElement.style.height    = 'auto';
    }
    var h = d.body.scrollHeight;
    if(h > 100){
      f.style.height    = h + 'px';
      f.style.minHeight = '0';
    }
  }catch(e){}
}
function resizeAllFrames(){
  document.querySelectorAll('iframe.ch-frame').forEach(resizeFrame);
  if(typeof updateProgress==='function') updateProgress();
}
function setupFrame(f){
  var tries = 0;
  function tick(){
    tries++;
    resizeFrame(f);
    if(tries < 30) setTimeout(tick, 200);
  }
  if(f.contentDocument && f.contentDocument.readyState === 'complete'){
    tick();
  } else {
    f.addEventListener('load', tick);
  }
}
document.querySelectorAll('iframe.ch-frame').forEach(setupFrame);
var rzT;
window.addEventListener('resize', function(){
  clearTimeout(rzT);
  rzT = setTimeout(resizeAllFrames, 200);
});

// 錨點點擊防錯跳
document.addEventListener('click', function(e){
  var a = e.target;
  while(a && a.tagName !== 'A') a = a.parentElement;
  if(!a) return;
  var h = a.getAttribute('href');
  if(!h || h.charAt(0) !== '#' || h.length < 2) return;
  var id = h.substring(1);
  var el = document.getElementById(id);
  if(!el) return;
  e.preventDefault();
  resizeAllFrames();
  setTimeout(function(){
    resizeAllFrames();
    var rect = el.getBoundingClientRect();
    var y = window.scrollY + rect.top - 20;
    window.scrollTo({top:y, behavior:'smooth'});
  }, 60);
}, true);

var _rt=0, _riv=setInterval(function(){
  _rt++; resizeAllFrames();
  if(_rt > 50) clearInterval(_riv);
}, 300);

// 防複製（外層）
(function(){
  var blk=function(e){e.preventDefault();return false;};
  ['contextmenu','copy','cut','selectstart','dragstart'].forEach(function(ev){
    document.addEventListener(ev, blk, true);
  });
  document.addEventListener('keydown',function(e){
    var k=e.key;
    if(e.ctrlKey&&(k==='c'||k==='C'||k==='a'||k==='A'||k==='s'||k==='S'||k==='p'||k==='P'||k==='u'||k==='U'||k==='x'||k==='X')){blk(e);}
    if(k==='F12')blk(e);
    if(e.ctrlKey&&e.shiftKey&&(k==='I'||k==='J'||k==='C'||k==='K')){blk(e);}
  },true);
})();
</script>

<script id="wy-decoder">
(function(){
  if(!window.__wyReady) return;
  var KEY = "wy-dazhidulun-42-v1";
  function _dec(b64){
    try{
      var raw = atob(b64);
      var bytes = new Uint8Array(raw.length);
      for(var i=0;i<raw.length;i++){
        bytes[i] = (raw.charCodeAt(i) ^ KEY.charCodeAt(i % KEY.length)) & 0xff;
      }
      if(typeof TextDecoder !== "undefined"){
        return new TextDecoder("utf-8").decode(bytes);
      }
      var s = "";
      for(var j=0;j<bytes.length;j++) s += String.fromCharCode(bytes[j]);
      return decodeURIComponent(escape(s));
    }catch(e){ return null; }
  }
  window.__wyReady.then(function(ok){
    if(!ok) return;
    document.querySelectorAll("iframe.ch-frame[data-c]").forEach(function(oldF){
      var decoded = _dec(oldF.getAttribute("data-c"));
      if(!decoded) return;
      var newF = document.createElement("iframe");
      for(var i=0;i<oldF.attributes.length;i++){
        var a = oldF.attributes[i];
        if(a.name === "data-c" || a.name === "srcdoc") continue;
        try{ newF.setAttribute(a.name, a.value); }catch(e){}
      }
      newF.setAttribute("srcdoc", decoded);
      try{ oldF.parentNode.replaceChild(newF, oldF); }catch(e){ return; }
      if(typeof window.setupFrame === "function"){
        try{ window.setupFrame(newF); }catch(e){}
      }
    });
    document.querySelectorAll("[data-wytext]").forEach(function(el){
      var t = _dec(el.getAttribute("data-wytext"));
      if(t === null) return;
      el.innerHTML = t;
      el.removeAttribute("data-wytext");
    });
    if(typeof window.resizeAllFrames === "function"){
      [150, 800, 2000].forEach(function(ms){
        setTimeout(function(){ try{ window.resizeAllFrames(); }catch(e){} }, ms);
      });
    }
  });
})();
</script>
